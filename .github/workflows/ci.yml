name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest

    # The backend's hand-written SQL - the Wilson ranking, the leaderboard
    # aggregates, the PnL backfill - cannot fail at compile time. Running it
    # against a real Postgres is the only thing that proves it executes, so
    # this job is not optional.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run integration suite
        # TEST_DATABASE_URL being set makes the runner use this service
        # container instead of booting its own embedded Postgres.
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oracle_test
        run: npm run test:integration

      - name: Smoke-test the frontend-facing API over HTTP
        # Migrates, seeds, boots the real server and asserts the exact field
        # names and scales the frontend reads. Catches routing, envelope and
        # serialisation breakage that the service-level tests cannot see.
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oracle_smoke
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE oracle_smoke;'
          npm run smoke

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/oracle-backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
